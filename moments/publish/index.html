---
layout: publisher
title: 发布日常
permalink: /moments/publish/
sitemap: false
---
<section class="moments" data-moments="publish" data-api="{{ site.moments_api_url | escape }}">
  <h1 class="page-title">发布日常</h1>
  <p><a href="{{ '/moments/' | relative_url }}">查看日常 →</a></p>
  <form id="moments-login" class="moments-form">
    <label for="moments-password">发布密码</label>
    <input id="moments-password" type="password" autocomplete="current-password" required>
    <button type="submit">登录</button>
  </form>
  <form id="moments-publish" class="moments-form" hidden>
    <label for="moments-body">记录此刻</label>
    <textarea id="moments-body" rows="6" maxlength="5000" placeholder="写点什么……"></textarea>
    <label for="moments-files">照片（最多 9 张）</label>
    <input id="moments-files" type="file" accept="image/*" multiple>
    <p class="moments-help">照片会压缩后上传。HEIC 照片若无法读取，请先转换成 JPEG。</p>
    <div id="moments-previews" class="moments-grid"></div>
    <button id="moments-submit" type="submit">发布</button>
    <button id="moments-logout" type="button" class="moments-secondary">退出登录</button>
  </form>
  <p id="moments-status" role="status" aria-live="polite"></p>
  <h2 class="section-heading">最近发布</h2>
  <div id="moments-manage"></div>
  <noscript>请启用 JavaScript 发布图文动态。</noscript>
</section>
<script src="{{ '/assets/js/moments.js' | relative_url }}" defer></script>
