<!DOCTYPE html>
<html lang="{{ page.lang | default: 'en' }}">

<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1, viewport-fit=cover" name="viewport">
  <title>{{ page.title | escape }}</title>
  <style>
    :root {
      color-scheme: light dark;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.7;
      background: #fff;
      color: #222;
    }

    .policy-page {
      max-width: 720px;
      margin: 0 auto;
      padding: 48px max(24px, env(safe-area-inset-right)) 0 max(24px, env(safe-area-inset-left));
    }

    .language-switch {
      margin-bottom: 40px;
      text-align: right;
    }

    h1 {
      margin: 0 0 32px;
      font-size: clamp(2rem, 7vw, 2.5rem);
      letter-spacing: -0.02em;
      line-height: 1.2;
    }

    h2 {
      margin: 40px 0 12px;
      font-size: 1.5rem;
      line-height: 1.3;
    }

    p,
    ul {
      margin: 0 0 20px;
    }

    a {
      color: #157347;
    }

    @media (max-width: 600px) {
      .policy-page {
        padding-top: 32px;
      }

      .language-switch {
        margin-bottom: 32px;
      }
    }

    @media (prefers-color-scheme: dark) {
      body {
        background: #111315;
        color: #e8e8e8;
      }

      a {
        color: #57d08b;
      }
    }
  </style>
</head>

<body>
  <main class="policy-page">
    {% if page.alternate_url and page.alternate_label %}
      <nav class="language-switch" aria-label="{{ page.language_switch_label | default: 'Language switch' | escape }}">
        <a href="{{ page.alternate_url | relative_url }}">{{ page.alternate_label | escape }}</a>
      </nav>
    {% endif %}
    {{ content }}
  </main>
</body>

</html>
