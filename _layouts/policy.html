<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1" name="viewport">
  <title>{{ page.title | escape }}</title>
  <style>
    :root {
      color-scheme: light dark;
    }

    body {
      margin: 0;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.7;
      background: #f7f7f7;
      color: #222;
    }

    .policy-page {
      max-width: 760px;
      margin: 0 auto;
      background: #fff;
      padding: 32px 24px;
      border-radius: 16px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.08);
    }

    h1,
    h2 {
      line-height: 1.3;
    }

    a {
      color: #157347;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background: #111315;
        color: #e8e8e8;
      }

      .policy-page {
        background: #1b1f24;
        box-shadow: none;
      }

      a {
        color: #57d08b;
      }
    }
  </style>
</head>

<body>
  <main class="policy-page">
    {{ content }}
  </main>
</body>

</html>
